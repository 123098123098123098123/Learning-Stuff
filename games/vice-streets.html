<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vice Streets</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:white;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:#20252b}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#000b;padding:10px 14px;border-radius:10px;font-weight:bold}#msg{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#000c;padding:10px 15px;border-radius:10px;opacity:0}</style></head>
<body><canvas id="game"></canvas><div id="hud"><div class="box">💵 $<span id="cash">0</span><br>❤️ <span id="hp">100</span>/100<br>🚨 <span id="wanted">☆☆☆☆☆</span><br>🔫 <span id="ammo">12</span>/12</div><div class="box">🧟 WAVE <span id="wave">1</span><br>WASD / Arrows = Move<br>Mouse / Space = Shoot<br>R = Reload</div></div><div id="msg"></div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),cashEl=document.getElementById("cash"),hpEl=document.getElementById("hp"),wantedEl=document.getElementById("wanted"),ammoEl=document.getElementById("ammo"),waveEl=document.getElementById("wave"),msg=document.getElementById("msg");
var keys={},mouse={x:0,y:0,down:false},player={x:1600,y:1100,r:15,angle:0,cash:0,hp:100,wanted:0},ammo=12,maxAmmo=12,reload=0,fire=0,wave=1,zombies=[],particles=[],last=0,msgTime=0;
function size(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}window.addEventListener("resize",size);size();
function toast(t){msg.textContent=t;msg.style.opacity=1;msgTime=1.5}
function spawn(){var n=Math.min(6+wave*2,30),i,a,d;for(i=0;i<n;i++){a=Math.random()*Math.PI*2;d=500+Math.random()*500;zombies.push({x:Math.max(30,Math.min(3170,player.x+Math.cos(a)*d)),y:Math.max(30,Math.min(2170,player.y+Math.sin(a)*d)),r:13,s:.65+wave*.06,hp:1+Math.floor((wave-1)/3),hit:0})}toast("WAVE "+wave+" — SURVIVE")}
function shoot(){if(reload>0||ammo<=0||fire>0)return;ammo--;fire=Math.max(.1,.28-(wave-1)*.01);var a=player.angle;if(mouse.x||mouse.y){a=Math.atan2(mouse.y-canvas.height/2,mouse.x-canvas.width/2);player.angle=a}var best=null,bestD=9999,i,z,vx,vy,proj,side;for(i=0;i<zombies.length;i++){z=zombies[i];vx=z.x-player.x;vy=z.y-player.y;proj=vx*Math.cos(a)+vy*Math.sin(a);side=Math.abs(-vx*Math.sin(a)+vy*Math.cos(a));if(proj>0&&proj<900&&side<45&&proj<bestD){best=z;bestD=proj}}if(best){best.hp--;best.hit=.12;if(best.hp<=0){player.cash+=50;zombies.splice(zombies.indexOf(best),1);toast("+$50 ZOMBIE");if(zombies.length===0){wave++;player.cash+=wave*100;spawn()}}}}
function update(dt){var dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1,i,z,a,dist;
if(reload>0){reload-=dt;if(reload<=0){ammo=maxAmmo;reload=0;toast("RELOADED")}}fire=Math.max(0,fire-dt);if(msgTime>0){msgTime-=dt;if(msgTime<=0)msg.style.opacity=0}
if(dx||dy){player.x+=dx/len*3.2*dt*60;player.y+=dy/len*3.2*dt*60;player.angle=Math.atan2(dy,dx)}player.x=Math.max(25,Math.min(3175,player.x));player.y=Math.max(25,Math.min(2175,player.y));
for(i=0;i<zombies.length;i++){z=zombies[i];a=Math.atan2(player.y-z.y,player.x-z.x);z.x+=Math.cos(a)*z.s*dt*60;z.y+=Math.sin(a)*z.s*dt*60;z.hit=Math.max(0,z.hit-dt);dist=Math.hypot(z.x-player.x,z.y-player.y);if(dist<z.r+player.r){if(!z.touch||z.touch<=0){player.hp=Math.max(0,player.hp-10);player.wanted=Math.min(5,player.wanted+1);z.touch=.7;toast(player.hp?"ZOMBIE HIT — -10 HP":"OUT OF HEALTH")}else z.touch-=dt;z.x-=Math.cos(a)*5;z.y-=Math.sin(a)*5}}
if(mouse.down)shoot();cashEl.textContent=player.cash;hpEl.textContent=player.hp;ammoEl.textContent=reload>0?"...":ammo;waveEl.textContent=wave;wantedEl.textContent="★".repeat(player.wanted)+"☆".repeat(5-player.wanted)}
function draw(){var w=canvas.width,h=canvas.height,i,z,px=w/2,py=h/2,ox=player.x-px,oy=player.y-py;ctx.clearRect(0,0,w,h);ctx.fillStyle="#20252b";ctx.fillRect(0,0,w,h);
ctx.save();ctx.translate(-ox,-oy);ctx.strokeStyle="#383d42";ctx.lineWidth=90;for(i=0;i<7;i++){ctx.beginPath();ctx.moveTo(i*500,0);ctx.lineTo(i*500,2200);ctx.stroke()}for(i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,i*440);ctx.lineTo(3200,i*440);ctx.stroke()}
ctx.fillStyle="#555";for(i=0;i<80;i++){var bx=(i*197)%3100+50,by=(i*131)%2100+50;ctx.fillRect(bx,by,120,80)}
for(i=0;i<zombies.length;i++){z=zombies[i];ctx.fillStyle=z.hit?"white":"#65784f";ctx.beginPath();ctx.arc(z.x,z.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.fillRect(z.x-8,z.y+8,6,12);ctx.fillRect(z.x+2,z.y+8,6,12)}
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle="#ff4f87";ctx.fillRect(-10,-10,20,20);ctx.strokeStyle="#ffd84d";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(35,0);ctx.stroke();ctx.restore();ctx.restore()}
function loop(t){var dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(e.key===" "){e.preventDefault();shoot()}if(e.key.toLowerCase()==="r"&&reload<=0&&ammo<maxAmmo){reload=1.1;toast("RELOADING...")}});window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});canvas.addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener("mousedown",function(e){mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY;shoot()});window.addEventListener("mouseup",function(){mouse.down=false});spawn();requestAnimationFrame(loop);
})();
</script></body></html>
