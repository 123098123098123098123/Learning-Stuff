<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>Neon Dodger</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="hud">
      <div>
        <span class="label">SCORE</span>
        <strong id="score">0</strong>
      </div>
      <div class="title">NEON DODGER</div>
      <div>
        <span class="label">BEST</span>
        <strong id="best">0</strong>
      </div>
    </header>

    <section class="game-card">
      <canvas id="game" aria-label="Neon Dodger game"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">ARCADE // 01</p>
          <h1>Neon Dodger</h1>
          <p>Dodge the falling blocks. Survive as long as you can.</p>
          <button id="start">Start Game</button>
          <p class="hint">Move with <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd></p>
        </div>
      </div>
    </section>

    <footer>
      <span>ESC to pause</span>
      <span>•</span>
      <span>Touch & drag on mobile</span>
    </footer>
  </main>
  <script src="./game.js"></script>
</body>
</html>
